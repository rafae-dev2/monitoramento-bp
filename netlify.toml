# Monitoramento BP — PWA para Netlify
# Deploy: arraste a pasta / use `netlify deploy --build` ou conecte o Git.
# Nada aqui contém senha: as credenciais ficam em Netlify → Site settings → Environment variables.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npx http-server public -p 8888"
  targetPort = 8888

# Sessão e APIs nunca são cacheadas pelo navegador ou CDN.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Revalidação leve de JS/CSS/JSON para impedir que o Service Worker novo copie
# arquivos antigos do cache HTTP do navegador ao trocar a versão do shell.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sgpa-alert-catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(self), interest-cohort=()"

# Rotas do módulo integrado de Chamados COA & FLOW (SPA React Router)
[[redirects]]
  from = "/novo"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/chamados"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/chamados/*"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/cadastros"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/config"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/kpi"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/relatorio"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/operacional"
  to = "/chamados-app.html"
  status = 200

[[redirects]]
  from = "/relatorios/*"
  to = "/chamados-app.html"
  status = 200
